project:
  type: book
  output-dir: _book
  execute-dir: project
  post-render:
    - python3 scripts/stabilize_html_numbering.py

book:
  title: "Deep Learning: Making It Trainable"
  subtitle: "Geometry, Dynamics, and the Machine"
  description: >
    Training failures can look alike while arising from curvature, arithmetic,
    estimator noise, or an implementation that moves the right mathematics
    through the machine incorrectly. This book builds the instruments that
    separate those causes through high-dimensional geometry, optimization
    dynamics, and hardware constraints. Every number is reproduced by pinned,
    laptop-scale code. The destination is a capability, not a catalog: open a
    current optimization paper and find the assumption it is really leaning on.
  author: "Heman Shakeri"
  date: "2026-07-31"
  repo-url: https://github.com/Shakeri-Lab/opt-book
  site-url: https://shakeri-lab.github.io/opt-book/
  downloads: [pdf]
  sidebar:
    style: docked
    search: true
  page-footer:
    left: >
      © Heman Shakeri · Text CC BY-NC-SA 4.0 · Code MIT ·
      School of Data Science, University of Virginia
    right: >
      DS 6210 · Numerical Analysis & Optimization
  chapters:
    - index.qmd
    - part: chapters/parts/act0.qmd
      chapters:
        - chapters/act0/01-count-not-cost.qmd
        - chapters/act0/02-streaming-state.qmd
        - chapters/act0/03-precision-contract.qmd
        - chapters/act0/04-quadratic-modes.qmd
    - part: chapters/parts/act1.qmd
      chapters:
        - chapters/act1/05-subgaussian-safe-zone.qmd
        - chapters/act1/06-products-squares.qmd
        - chapters/act1/07-epsilon-nets.qmd
        - chapters/act1/08-random-operators.qmd
        - chapters/act1/09-marchenko-pastur.qmd
        - chapters/act1/10-effective-rank.qmd
    - part: chapters/parts/act2.qmd
      chapters:
        - chapters/act2/11-reverse-accumulation.qmd
        - chapters/act2/12-curvature.qmd
        - chapters/act2/13-stochastic-regimes.qmd
        - chapters/act2/14-criticality.qmd
        - chapters/act2/15-normalization.qmd
        - chapters/act2/16-edge-of-stability.qmd
        - chapters/act2/17-update-geometry.qmd
    - chapters/coda.qmd
    - chapters/provenance.qmd
    - references.qmd
  appendices:
    - chapters/appendices/notation.qmd
    - chapters/appendices/rosetta.qmd
    - chapters/appendices/incident-card.qmd

bibliography: references.bib
filters:
  - filters/stable-chapter-numbering.lua

execute:
  freeze: auto
  error: true
  warning: false

format:
  html:
    theme: [cosmo, trainable.scss]
    html-math-method: mathjax
    include-in-header: mathjax-config.html
    code-link: true
    code-copy: true
    code-fold: false
    toc: true
    toc-depth: 3
    number-depth: 2
  pdf:
    documentclass: scrbook
    pdf-engine: lualatex
    include-in-header:
      - tex/macros.tex
      - tex/accessibility.tex
    toc: true
    number-sections: true
    colorlinks: true
    keep-tex: true
    geometry:
      - margin=1.05in

language:
  title-block-author-single: "Author"
