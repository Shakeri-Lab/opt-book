name: book

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: "0"
  PYTHONHASHSEED: "0"
  MPLBACKEND: "Agg"

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv build harness --wheel --out-dir /tmp/harness-build
      - name: Test immediately previous harness pin
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-16/trainable_harness-0.16.0-py3-none-any.whl
          uv run pytest -q harness/tests --ignore=harness/tests/test_update_geometry.py
          uv run python experiments/c16_edge_of_stability.py
      - name: Test current harness pin
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-17/trainable_harness-0.17.0-py3-none-any.whl
          uv run pytest -q harness/tests
          uv run python experiments/c17_update_geometry.py
          uv run python experiments/c17_weight_update_spectrum.py
          uv run python experiments/c01_roofline.py
          uv run python experiments/c01_local_measurement.py
          uv run python experiments/coda_incident.py
      - run: uv run python scripts/run_fast_audits.py

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - run: uv sync --locked
      - name: Install PDF text-layer audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - run: QUARTO_PYTHON=.venv/bin/python quarto render
      - name: Recompile retained TeX and preserve the LuaLaTeX log
        run: |
          mkdir -p tmp/pdfs
          if command -v lualatex >/dev/null 2>&1; then
            lualatex_bin="$(command -v lualatex)"
          else
            shopt -s nullglob
            tinytex_bins=(
              "$HOME"/.TinyTeX/bin/*/lualatex
              "$HOME"/Library/TinyTeX/bin/*/lualatex
            )
            test "${#tinytex_bins[@]}" -gt 0
            lualatex_bin="${tinytex_bins[0]}"
          fi
          TEXINPUTS=./_book//: "$lualatex_bin" -interaction=batchmode -halt-on-error -output-directory=tmp/pdfs Deep-Learning--Making-It-Trainable.tex
          TEXINPUTS=./_book//: "$lualatex_bin" -interaction=batchmode -halt-on-error -output-directory=tmp/pdfs Deep-Learning--Making-It-Trainable.tex
          cp tmp/pdfs/Deep-Learning--Making-It-Trainable.log tmp/pdfs/book-build.log
      - run: uv run python scripts/audit_rendered.py
      - run: uv run python scripts/audit_book_metrics.py
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-book
          path: _book/
      - name: Configure GitHub Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book/

  historical:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Execute historical ch-02 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-02/trainable_harness-0.2.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_streaming.py
          uv run python experiments/c02_variance.py
      - name: Execute historical ch-03 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-03/trainable_harness-0.3.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_streaming.py harness/tests/test_precision.py
          uv run python experiments/c03_precision.py
      - name: Execute historical ch-04 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-04/trainable_harness-0.4.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_streaming.py harness/tests/test_precision.py harness/tests/test_optimization.py
          uv run python experiments/c04_quadratics.py
      - name: Execute historical ch-05 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-05/trainable_harness-0.5.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_streaming.py harness/tests/test_precision.py harness/tests/test_optimization.py harness/tests/test_probability.py
          uv run python experiments/c05_subgaussian.py
      - name: Execute historical ch-06 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-06/trainable_harness-0.6.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_streaming.py harness/tests/test_precision.py harness/tests/test_optimization.py harness/tests/test_probability.py harness/tests/test_subexponential.py
          uv run python experiments/c06_subexponential.py
      - name: Execute historical ch-07 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-07/trainable_harness-0.7.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_streaming.py harness/tests/test_precision.py harness/tests/test_optimization.py harness/tests/test_probability.py harness/tests/test_subexponential.py harness/tests/test_geometry.py
          uv run python experiments/c07_epsilon_nets.py
      - name: Execute historical ch-08 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-08/trainable_harness-0.8.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_streaming.py harness/tests/test_precision.py harness/tests/test_optimization.py harness/tests/test_probability.py harness/tests/test_subexponential.py harness/tests/test_geometry.py
          uv run python - <<'PY'
          import numpy as np
          from trainable_harness import matrix_spectrum_summary, power_iteration_spectral_norm
          matrix = np.diag([5.0, 2.0, 0.5])
          summary = matrix_spectrum_summary(matrix)
          assert summary.singular_values == (5.0, 2.0, 0.5)
          result = power_iteration_spectral_norm(matrix, iterations=12, seed=6223)
          assert abs(result.estimates[-1] - 5.0) < 1e-8
          PY
          uv run python experiments/c08_random_operators.py
      - name: Execute historical ch-09 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-09/trainable_harness-0.9.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_streaming.py harness/tests/test_precision.py harness/tests/test_optimization.py harness/tests/test_probability.py harness/tests/test_subexponential.py harness/tests/test_geometry.py harness/tests/test_spectra.py
          uv run python experiments/c09_spectral_null.py
      - name: Execute historical ch-10 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-10/trainable_harness-0.10.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_streaming.py harness/tests/test_precision.py harness/tests/test_optimization.py harness/tests/test_probability.py harness/tests/test_subexponential.py harness/tests/test_geometry.py harness/tests/test_spectra.py harness/tests/test_effective_rank.py
          uv run python experiments/c10_effective_rank.py
      - name: Execute historical ch-11 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-11/trainable_harness-0.11.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_streaming.py harness/tests/test_precision.py harness/tests/test_optimization.py harness/tests/test_probability.py harness/tests/test_subexponential.py harness/tests/test_geometry.py harness/tests/test_spectra.py harness/tests/test_effective_rank.py harness/tests/test_autodiff.py
          uv run python experiments/c11_reverse_accumulation.py
      - name: Execute historical ch-12 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-12/trainable_harness-0.12.0-py3-none-any.whl
          uv run pytest -q harness/tests
          uv run python experiments/c12_curvature.py
      - name: Execute historical ch-13 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-13/trainable_harness-0.13.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_stochastic.py
          uv run python experiments/c13_stochastic_regimes.py
          uv run python experiments/c13_regime_controls.py
      - name: Execute historical ch-14 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-14/trainable_harness-0.14.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_criticality.py
          uv run python experiments/c14_criticality.py
          uv run python experiments/c14_gated_product.py
      - name: Execute historical ch-15 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-15/trainable_harness-0.15.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_normalization.py
          uv run python experiments/c15_normalization.py
          uv run python experiments/c15_running_state.py
      - name: Execute historical ch-16 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-16/trainable_harness-0.16.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_stability.py
          uv run python experiments/c16_edge_of_stability.py
          uv run python experiments/c16_stochastic_contrast.py
      - name: Execute current ch-17 pin and evidence
        run: |
          uv pip install --python .venv/bin/python --force-reinstall artifacts/harness/ch-17/trainable_harness-0.17.0-py3-none-any.whl
          uv run pytest -q harness/tests/test_update_geometry.py
          uv run python experiments/c17_update_geometry.py
          uv run python experiments/c17_weight_update_spectrum.py
          uv run python experiments/c01_roofline.py
          uv run python experiments/c01_local_measurement.py
          uv run python experiments/coda_incident.py
      - name: Verify sibling public anchors
        run: uv run python scripts/audit_sibling_anchors.py --network
      - run: git diff --exit-code -- artifacts/claims

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [fast, render]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
