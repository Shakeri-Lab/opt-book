rejected_or_scoped_claims:
  - Effective rank is not called the cause of generalization.
  - A learned spectral spike is not assumed to reduce effective rank unless the trace change is also measured.
  - Effective rank and stable rank are not used as interchangeable names for one formula.
  - A small effective rank does not prove compressibility at a requested approximation error without the full spectral tail.
  - Parameter count, VC dimension, Rademacher complexity, double descent, neural collapse, PCA mechanics, and low-rank adaptation mechanics are not surveyed.
  - A population covariance theorem is not applied automatically to weight matrices, activations, updates, or Hessians.
