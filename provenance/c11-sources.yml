rejected_or_scoped_claims:
  - Numerical differentiation is not called exact and no current-model parameter count or GPU-year anecdote is imported.
  - Symbolic differentiation is not called inherently exponential; expression swell is separated from DAG reuse and common-subexpression elimination.
  - The Baur--Strassen constant is not generalized from rational straight-line programs to arbitrary framework operations.
  - Reverse mode is not described as memory-free or universally cheaper than forward mode.
  - The uniform square-root checkpoint schedule is not called globally optimal for arbitrary computation graphs.
  - CPU operation counts are not presented as accelerator runtime or roofline measurements.
  - Hessians, initialization criticality, activation-family comparisons, mixed-precision recipes, and IO-aware all-pairs kernels remain outside C11.
