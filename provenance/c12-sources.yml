rejected_or_scoped_claims:
  - Second order is not treated as one operator or one algorithm family.
  - GGN, model Fisher, and empirical Fisher are not called interchangeable.
  - A positive-semidefinite surrogate is not called the realized Hessian.
  - A diagonal, block, or Kronecker approximation inherits no approximation guarantee without an error and state contract.
  - HVP arithmetic counts are not reported as measured accelerator performance.
  - Algebraic CG/BFGS correspondence is not used as evidence of calibrated posterior uncertainty.
  - Trained Hessians receive no Wishart or Marchenko--Pastur null without a declared generative model.
