[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trainable-harness"
version = "0.11.0"
description = "Evolving diagnostic harness for Deep Learning: Making It Trainable"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3"]
license = "MIT"
authors = [{name = "Heman Shakeri"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
